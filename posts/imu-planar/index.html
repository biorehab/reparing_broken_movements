<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMU: Planar Arm Motion</title>
<style>
  :root {
    --bg: #fafaf7; --surface: #ffffff; --border: #e0ddd6;
    --text: #1a1a1a; --text-muted: #6b6560;
    --accent: #1a5fa8;
    --font-serif: "Georgia","Times New Roman",serif;
    --font-mono: "Menlo","Consolas",monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-serif); font-size: 16px; line-height: 1.7; }
  .page-wrapper { max-width: 820px; margin: 0 auto; padding: 48px 24px 80px; }
  .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-family: var(--font-mono); color: var(--text-muted); text-decoration: none; letter-spacing: 0.02em; margin-bottom: 40px; border-bottom: 1px solid transparent; transition: color .15s, border-color .15s; }
  .back-link:hover { color: var(--accent); border-color: var(--accent); }
  header { margin-bottom: 36px; }
  .tag { display: inline-block; font-size: 11px; font-family: var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); background: #eef3fb; padding: 3px 10px; border-radius: 2px; margin-bottom: 14px; }
  h1 { font-size: 28px; font-weight: normal; line-height: 1.3; letter-spacing: -.01em; margin-bottom: 10px; }
  .subtitle { font-size: 15px; color: var(--text-muted); font-style: italic; }
  .divider { border: none; border-top: 1px solid var(--border); margin: 28px 0; }

  /* ── Control panel ───────────────────────────────────────────────────────── */
  .controls {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 4px; padding: 14px 24px;
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 14px; flex-wrap: wrap;
  }
  .ctrl-btn {
    font-family: var(--font-mono); font-size: 11px; padding: 6px 20px;
    border: 1.5px solid var(--border); border-radius: 3px;
    background: var(--surface); color: var(--text-muted);
    cursor: pointer; letter-spacing: .06em; text-transform: uppercase;
    transition: all .15s;
  }
  .ctrl-btn:hover { border-color: var(--accent); color: var(--accent); }
  .ctrl-btn.primary { border-color: var(--accent); color: var(--accent); }
  .ctrl-btn.primary:hover { background: var(--accent); color: #fff; }
  .hint {
    font-family: var(--font-mono); font-size: 12px;
    color: var(--text-muted); margin-left: auto;
  }
  .hint.warn { color: #b83232; }

  /* ── Display area ────────────────────────────────────────────────────────── */
  .display-panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 4px; overflow: hidden; cursor: default;
  }
  .display-panel svg { display: block; width: 100%; }

  footer { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 13px; color: var(--text-muted); font-family: var(--font-mono); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  footer a { color: var(--text-muted); text-decoration: underline; }
  footer a:hover { color: var(--accent); }
</style>
</head>
<body>
<div class="page-wrapper">

  <a class="back-link" href="../../index.html">← Back to simulations</a>

  <header>
    <div class="tag">Interactive Simulation</div>
    <h1>IMU: Planar Arm Motion</h1>
    <p class="subtitle">Companion simulation for the blog post on inertial measurement units</p>
  </header>

  <hr class="divider">

  <!-- ── Controls ──────────────────────────────────────────────────────────── -->
  <div class="controls">
    <button class="ctrl-btn"         id="btn-reset">Reset</button>
    <button class="ctrl-btn primary" id="btn-random">Random positions</button>
    <span class="hint" id="hint-text">Click to set start position</span>
  </div>

  <!-- ── Display ───────────────────────────────────────────────────────────── -->
  <div class="display-panel" id="display-panel">
    <svg id="arm-svg" viewBox="0 0 640 560" preserveAspectRatio="xMidYMid meet" height="560">

      <!-- Reachable workspace region (annulus, evenodd fill) -->
      <path id="workspace-region" fill="#dce8f7" fill-opacity="0.45" stroke="#9ab4d4" stroke-width="1" fill-rule="evenodd"/>

      <!-- Links -->
      <line id="link1" stroke="#444" stroke-width="3"   stroke-linecap="round"/>
      <line id="link2" stroke="#777" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Joints -->
      <circle id="dot-shoulder" r="6" fill="#1a5fa8"/>
      <circle id="dot-elbow"    r="4" fill="#555"/>
      <circle id="dot-hand"     r="4" fill="#555"/>

      <!-- Start marker -->
      <circle id="mark-start"       r="9" fill="none" stroke="#2a7a3a" stroke-width="2" visibility="hidden"/>
      <circle id="mark-start-inner" r="3" fill="#2a7a3a"                                visibility="hidden"/>

      <!-- End marker -->
      <circle id="mark-end"       r="9" fill="none" stroke="#b83232" stroke-width="2" visibility="hidden"/>
      <circle id="mark-end-inner" r="3" fill="#b83232"                                visibility="hidden"/>

    </svg>
  </div>

  <footer>
    <span>Repairing Broken Movements &mdash; Sivakumar Balasubramanian</span>
    <a href="https://siva82kb.substack.com" target="_blank">Full article on Substack &rarr;</a>
  </footer>

</div>
<script>
// ─── Geometry ─────────────────────────────────────────────────────────────────
const SVG_W = 640, SVG_H = 560;
const L1 = 150, L2 = 110;          // link lengths (px)
const D_MAX = L1 + L2;             // 260 px  — max reach
const D_MIN = Math.abs(L1 - L2);   // 40 px   — min reach

// Shoulder centred in the viewBox so the full annulus (r=40..260) is visible.
// Shoulder angle convention: 0° = arm pointing straight DOWN,
//   positive = counterclockwise (toward front/up).
// No joint angle limits — only physical reach bounds apply.
//
// Annulus fits inside 640×560 with 20 px margin when shoulder is centred:
//   SX = 640/2 = 320, SY = 560/2 = 280.
const SX = 320, SY = 280;
const MARGIN = 20;
const DEG = Math.PI / 180;

const MIN_SEP = 0.25 * D_MAX;      // minimum start–end separation (65 px)

// ─── Angle conversion ─────────────────────────────────────────────────────────
// User angle (deg):  0° = down, positive = CCW toward up/front
// SVG angle  (rad):  0 = right (+x), positive = CW (y-down coords)
const userToSvg = deg => Math.PI / 2 - deg * DEG;

// ─── Forward kinematics ───────────────────────────────────────────────────────
function fk(t1, t2) {
  const ex = SX + L1 * Math.cos(t1),      ey = SY + L1 * Math.sin(t1);
  const hx = ex + L2 * Math.cos(t1 + t2), hy = ey + L2 * Math.sin(t1 + t2);
  return { ex, ey, hx, hy };
}

// ─── IK solver ────────────────────────────────────────────────────────────────
// Returns { t1, t2 } or null if outside physical reach bounds.
// Elbow-up solution (t2 ≤ 0).  No joint angle limits.
function solveIK(tx, ty) {
  const dx = tx - SX, dy = ty - SY;
  const d  = Math.hypot(dx, dy);
  if (d > D_MAX || d < D_MIN) return null;

  const alpha = Math.atan2(dy, dx);
  const cosT2 = (d * d - L1 * L1 - L2 * L2) / (2 * L1 * L2);
  const t2    = -Math.acos(Math.max(-1, Math.min(1, cosT2)));  // ≤ 0 (elbow-up)
  const beta  = Math.atan2(L2 * Math.sin(t2), L1 + L2 * Math.cos(t2));
  const t1    = alpha - beta;

  return { t1, t2 };
}

// ─── State ────────────────────────────────────────────────────────────────────
let phase    = 'start';   // 'start' | 'end' | 'done'
let posStart = null, posEnd = null;
let curT1, curT2;         // current joint angles

// ─── SVG helpers ──────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);

function setLine(id, x1, y1, x2, y2) {
  const el = $(id);
  ['x1','y1','x2','y2'].forEach((a, i) => el.setAttribute(a, [x1,y1,x2,y2][i]));
}
function setCirclePos(id, cx, cy) {
  $(id).setAttribute('cx', cx); $(id).setAttribute('cy', cy);
}
function showMarker(prefix, x, y) {
  [`mark-${prefix}`, `mark-${prefix}-inner`].forEach(id => {
    setCirclePos(id, x, y);
    $(id).setAttribute('visibility', 'visible');
  });
}
function hideMarker(prefix) {
  [`mark-${prefix}`, `mark-${prefix}-inner`].forEach(id =>
    $(id).setAttribute('visibility', 'hidden'));
}

// ─── Draw arm ─────────────────────────────────────────────────────────────────
function drawArm(t1, t2) {
  curT1 = t1; curT2 = t2;
  const { ex, ey, hx, hy } = fk(t1, t2);
  setLine('link1', SX, SY, ex, ey);
  setLine('link2', ex, ey, hx, hy);
  setCirclePos('dot-shoulder', SX, SY);
  setCirclePos('dot-elbow', ex, ey);
  setCirclePos('dot-hand', hx, hy);
}

// ─── Workspace annulus ────────────────────────────────────────────────────────
// Without joint limits the workspace is a full annulus (inner r=D_MIN, outer r=D_MAX).
// Two counter-wound circles with fill-rule="evenodd" create the ring.
function buildWorkspace() {
  const ro = D_MAX, ri = D_MIN;
  const circle = (cx, cy, r, cw) => {
    const s = cw ? 1 : 0;
    return `M ${cx - r} ${cy} A ${r} ${r} 0 1 ${s} ${cx + r} ${cy} A ${r} ${r} 0 1 ${s} ${cx - r} ${cy} Z`;
  };
  $('workspace-region').setAttribute('d', circle(SX, SY, ro, true) + ' ' + circle(SX, SY, ri, false));
}

// ─── Default pose ─────────────────────────────────────────────────────────────
function defaultPose() {
  const t1 = userToSvg(60);   // arm pointing 60° from down (roughly 30° above horizontal)
  const t2 = -70 * DEG;       // elbow at 70° flexion
  drawArm(t1, t2);
}

// ─── Random workspace point ───────────────────────────────────────────────────
function randomInWorkspace() {
  for (let i = 0; i < 500; i++) {
    const angle = Math.random() * 2 * Math.PI;
    const d = D_MIN + Math.random() * (D_MAX - D_MIN);
    const hx = SX + d * Math.cos(angle);
    const hy = SY + d * Math.sin(angle);
    if (hx >= MARGIN && hx <= SVG_W - MARGIN &&
        hy >= MARGIN && hy <= SVG_H - MARGIN)
      return { x: hx, y: hy };
  }
  return null;
}

function randomPositions() {
  for (let i = 0; i < 1000; i++) {
    const p1 = randomInWorkspace();
    const p2 = randomInWorkspace();
    if (p1 && p2 && Math.hypot(p2.x - p1.x, p2.y - p1.y) >= MIN_SEP)
      return { p1, p2 };
  }
  return null;
}

// ─── Reset ────────────────────────────────────────────────────────────────────
function reset() {
  phase = 'start'; posStart = posEnd = null;
  hideMarker('start'); hideMarker('end');
  defaultPose();
  setHint('Click to set start position', false);
}

function setHint(msg, warn = false) {
  const el = $('hint-text');
  el.textContent = msg;
  el.className = 'hint' + (warn ? ' warn' : '');
}

// ─── Cursor: crosshair inside workspace, default outside ─────────────────────
const armSvg = $('arm-svg');
const displayPanel = $('display-panel');

function clientToSvg(clientX, clientY) {
  const pt = armSvg.createSVGPoint();
  pt.x = clientX; pt.y = clientY;
  return pt.matrixTransform(armSvg.getScreenCTM().inverse());
}

displayPanel.addEventListener('mousemove', e => {
  const { x, y } = clientToSvg(e.clientX, e.clientY);
  displayPanel.style.cursor = solveIK(x, y) ? 'crosshair' : 'default';
});
displayPanel.addEventListener('mouseleave', () => {
  displayPanel.style.cursor = 'default';
});

// ─── Click → IK → draw ────────────────────────────────────────────────────────
displayPanel.addEventListener('click', e => {
  if (phase === 'done') return;

  const { x: svgX, y: svgY } = clientToSvg(e.clientX, e.clientY);

  const sol = solveIK(svgX, svgY);
  if (!sol) {
    setHint('Outside reachable workspace — try a different spot', true);
    return;
  }

  if (phase === 'start') {
    posStart = { x: svgX, y: svgY };
    showMarker('start', svgX, svgY);
    drawArm(sol.t1, sol.t2);
    phase = 'end';
    setHint('Click to set end position');

  } else if (phase === 'end') {
    if (Math.hypot(svgX - posStart.x, svgY - posStart.y) < MIN_SEP) {
      setHint('Too close to start — click further away', true);
      return;
    }
    posEnd = { x: svgX, y: svgY };
    showMarker('end', svgX, svgY);
    drawArm(sol.t1, sol.t2);
    phase = 'done';
    setHint('Start (green) and end (red) positions set');
  }
});

// ─── Buttons ──────────────────────────────────────────────────────────────────
$('btn-reset').addEventListener('click', reset);

$('btn-random').addEventListener('click', () => {
  const result = randomPositions();
  if (!result) { setHint('Could not find two valid positions — try again', true); return; }
  const { p1, p2 } = result;
  posStart = p1; posEnd = p2;
  showMarker('start', p1.x, p1.y);
  showMarker('end',   p2.x, p2.y);
  // Move arm to end position
  const sol = solveIK(p2.x, p2.y);
  if (sol) drawArm(sol.t1, sol.t2);
  phase = 'done';
  setHint('Start (green) and end (red) positions set');
});

// ─── Init ─────────────────────────────────────────────────────────────────────
buildWorkspace();
defaultPose();
</script>
</body>
</html>
