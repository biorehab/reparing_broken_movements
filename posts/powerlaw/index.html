<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power Law of Movement</title>
<style>
  :root {
    --bg: #fafaf7; --surface: #ffffff; --border: #e0ddd6;
    --text: #1a1a1a; --text-muted: #6b6560;
    --accent: #1a5fa8;
    --font-serif: "Georgia","Times New Roman",serif;
    --font-mono: "Menlo","Consolas",monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-serif); font-size: 16px; line-height: 1.7; }
  .page-wrapper { max-width: 960px; margin: 0 auto; padding: 48px 24px 80px; }
  .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-family: var(--font-mono); color: var(--text-muted); text-decoration: none; letter-spacing: .02em; margin-bottom: 40px; border-bottom: 1px solid transparent; transition: color .15s, border-color .15s; }
  .back-link:hover { color: var(--accent); border-color: var(--accent); }
  header { margin-bottom: 36px; }
  .tag { display: inline-block; font-size: 11px; font-family: var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); background: #eef3fb; padding: 3px 10px; border-radius: 2px; margin-bottom: 14px; }
  h1 { font-size: 28px; font-weight: normal; line-height: 1.3; letter-spacing: -.01em; margin-bottom: 10px; }
  .subtitle { font-size: 15px; color: var(--text-muted); font-style: italic; }
  .divider { border: none; border-top: 1px solid var(--border); margin: 28px 0; }

  .controls {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 4px; padding: 12px 20px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .ctrl-btn {
    font-family: var(--font-mono); font-size: 11px; padding: 5px 16px;
    border: 1.5px solid var(--border); border-radius: 3px;
    background: var(--surface); color: var(--text-muted);
    cursor: pointer; letter-spacing: .06em; text-transform: uppercase;
    transition: all .15s;
  }
  .ctrl-btn:hover  { border-color: var(--accent); color: var(--accent); }
  .ctrl-btn.active { border-color: var(--accent); background: var(--accent); color: #fff; }
  .ctrl-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
  .ctrl-label { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); letter-spacing: .06em; text-transform: uppercase; }
  select.ctrl-select {
    font-family: var(--font-mono); font-size: 11px; padding: 5px 10px;
    border: 1.5px solid var(--border); border-radius: 3px;
    background: var(--surface); color: var(--text-muted); cursor: pointer;
  }
  select.ctrl-select:focus { outline: none; border-color: var(--accent); }
  .slider-wrap {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 4px; padding: 10px 20px; margin-bottom: 10px;
  }
  input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }
  .display-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
  .display-panel svg { display: block; width: 100%; }
  footer { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 13px; color: var(--text-muted); font-family: var(--font-mono); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  footer a { color: var(--text-muted); text-decoration: underline; }
  footer a:hover { color: var(--accent); }
</style>
</head>
<body>
<div class="page-wrapper">

  <a class="back-link" href="../../index.html">← Back to simulations</a>

  <header>
    <div class="tag">Interactive Simulation</div>
    <h1>The Power Law of Movement</h1>
    <p class="subtitle">Real arm movement data showing the speed–curvature power law</p>
  </header>

  <hr class="divider">

  <div class="controls">
    <span class="ctrl-label">Dataset</span>
    <select class="ctrl-select" id="sel-dataset">
      <option value="small_ellipse.csv">Small ellipse</option>
      <option value="medium_ellipse.csv" selected>Medium ellipse</option>
      <option value="big_ellipse.csv">Big ellipse</option>
      <option value="figure8.csv">Figure 8</option>
    </select>
    <div class="ctrl-sep"></div>
    <button class="ctrl-btn active" id="btn-play">▶ Play</button>
    <button class="ctrl-btn" id="btn-reset">Reset</button>
    <div class="ctrl-sep"></div>
    <span class="ctrl-label">Speed</span>
    <button class="ctrl-btn speed-btn" data-speed="0.25">¼×</button>
    <button class="ctrl-btn speed-btn" data-speed="0.5">½×</button>
    <button class="ctrl-btn speed-btn active" data-speed="1">1×</button>
    <button class="ctrl-btn speed-btn" data-speed="2">2×</button>
    <div class="ctrl-sep"></div>
    <span class="ctrl-label">Log–log</span>
    <select class="ctrl-select" id="sel-pair">
      <option value="v_kappa"      selected>v vs κ</option>
      <option value="v_radius"            >v vs R</option>
      <option value="omega_kappa"         >ω vs κ</option>
      <option value="omega_radius"        >ω vs R</option>
    </select>
  </div>

  <div class="slider-wrap">
    <input type="range" id="time-slider" min="0" max="1000" value="0">
  </div>

  <div class="display-panel">
    <svg id="main-svg" viewBox="0 0 900 430" preserveAspectRatio="xMidYMid meet" height="430">
      <defs>
        <!-- Trajectory panel clip -->
        <clipPath id="traj-clip">
          <rect x="20" y="45" width="210" height="370"/>
        </clipPath>
        <!-- Log–log plot area clip (in g-loglog local space) -->
        <clipPath id="ll-plot-clip">
          <rect id="ll-plot-clip-rect" x="0" y="0" width="0" height="0"/>
        </clipPath>
        <!-- Frenet frame arrowheads -->
        <marker id="frenet-t-head" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
          <path d="M0,0 L0,6 L6,3 z" fill="#e07b39"/>
        </marker>
        <marker id="frenet-n-head" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
          <path d="M0,0 L0,6 L6,3 z" fill="#7c3aed"/>
        </marker>
        <marker id="vel-head" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
          <path d="M0,0 L0,6 L6,3 z" fill="#111"/>
        </marker>
      </defs>

      <!-- ── Panel 1: Trajectory ─────────────────────────────────────────── -->
      <text x="125" y="34" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="12" fill="#666">Trajectory</text>
      <g id="g-traj" clip-path="url(#traj-clip)">
        <polyline id="traj-full"    fill="none" stroke="#ddd"    stroke-width="1"   stroke-linejoin="round"/>
        <polyline id="traj-visited" fill="none" stroke="#7aaedb" stroke-width="1.5" stroke-linejoin="round"/>
        <circle   id="osc-circle"   fill="none" stroke="#52b788" stroke-width="1"   visibility="hidden"/>
        <line     id="frenet-t"     stroke="#e07b39" stroke-width="1.5" marker-end="url(#frenet-t-head)" visibility="hidden"/>
        <line     id="frenet-n"     stroke="#7c3aed" stroke-width="1.5" marker-end="url(#frenet-n-head)" visibility="hidden"/>
        <line     id="vel-arrow"    stroke="#111"    stroke-width="1.5" marker-end="url(#vel-head)"     visibility="hidden"/>
        <circle   id="traj-dot"     r="5" fill="#b83232"/>
      </g>

      <!-- ── Panel 2a: Speed ─────────────────────────────────────────────── -->
      <text id="speed-label" x="400" y="34" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="12" fill="#1a5fa8">Speed</text>
      <g id="g-speed">
        <polyline id="speed-full"    fill="none" stroke="#e0e0e0" stroke-width="1" stroke-linejoin="round"/>
        <polyline id="speed-visited" fill="none" stroke="#1a5fa8" stroke-width="2" stroke-linejoin="round"/>
        <line     id="speed-cursor"  stroke="#aaa" stroke-width="1" stroke-dasharray="3,3"/>
      </g>

      <!-- ── Panel 2b: Curvature ─────────────────────────────────────────── -->
      <text id="curv-label" x="400" y="224" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="12" fill="#b83232">Curvature</text>
      <g id="g-curv">
        <polyline id="curv-full"    fill="none" stroke="#e0e0e0" stroke-width="1" stroke-linejoin="round"/>
        <polyline id="curv-visited" fill="none" stroke="#b83232" stroke-width="2" stroke-linejoin="round"/>
        <line     id="curv-cursor"  stroke="#aaa" stroke-width="1" stroke-dasharray="3,3"/>
      </g>

      <!-- ── Panel 3: Log–log ────────────────────────────────────────────── -->
      <text id="ll-title" x="745" y="34" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="12" fill="#555"/>
      <g id="g-loglog">
        <text id="ll-xlabel" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="11" fill="#888"/>
        <text id="ll-ylabel" text-anchor="middle" font-family="Helvetica,sans-serif" font-size="11" fill="#888" transform="rotate(-90)"/>
        <g id="ll-legend"/>
        <g clip-path="url(#ll-plot-clip)">
          <g id="loglog-scatter"/>
          <line id="ll-fit-line" stroke="#1a5fa8" stroke-width="1.5"/>
          <line id="ll-ref-line" stroke="#b83232" stroke-width="1.5" stroke-dasharray="5,4"/>
          <g id="loglog-trail"/>
          <circle id="loglog-dot" r="5" fill="#b83232"/>
        </g>
        <rect id="ll-border" fill="none" stroke="#ddd" stroke-width="1"/>
      </g>
    </svg>
  </div>

  <footer>
    <span>Repairing Broken Movements &mdash; Sivakumar Balasubramanian</span>
    <a href="https://siva82kb.substack.com" target="_blank">Full article on Substack &rarr;</a>
  </footer>

</div>
<script>
// ─── Layout constants ─────────────────────────────────────────────────────────
const TRAJ    = { x1: 20,  y1: 45, x2: 230, y2: 415 };
const SPEED_G = { tx: 265, ty: 45 };
const SPEED   = { x1: 0,   y1: 0,  x2: 270, y2: 150 };
const CURV_G  = { tx: 265, ty: 230 };
const CURV    = { x1: 0,   y1: 0,  x2: 270, y2: 150 };
const LL_G    = { tx: 570, ty: 45 };
const LL      = { x1: 30,  y1: 5,  x2: 295, y2: 355 };

const TRAIL_WIN = 1.0;
const LL_TRAIL  = 40;
const FRAME_LEN = 35;   // SVG px for Frenet vectors
const VEL_ARROW_LEN = 50; // SVG px for max-speed velocity arrow

// ─── Pair config ──────────────────────────────────────────────────────────────
const PAIRS = {
  v_kappa:      { xCol: 'log_curvature', yCol: 'log_speed', xLabel: 'log κ', yLabel: 'log v', title: 'Speed vs Curvature (log–log)',        yDataCol: 'speed', xDataCol: 'curvature', yPanelLabel: 'Speed',         xPanelLabel: 'Curvature', showVelArrow: true  },
  v_radius:     { xCol: 'log_radius',    yCol: 'log_speed', xLabel: 'log R', yLabel: 'log v', title: 'Speed vs Radius (log–log)',            yDataCol: 'speed', xDataCol: 'radius',    yPanelLabel: 'Speed',         xPanelLabel: 'Radius',    showVelArrow: true  },
  omega_kappa:  { xCol: 'log_curvature', yCol: 'log_omega', xLabel: 'log κ', yLabel: 'log ω', title: 'Ang. velocity vs Curvature (log–log)', yDataCol: 'omega', xDataCol: 'curvature', yPanelLabel: 'Ang. velocity', xPanelLabel: 'Curvature', showVelArrow: false },
  omega_radius: { xCol: 'log_radius',    yCol: 'log_omega', xLabel: 'log R', yLabel: 'log ω', title: 'Ang. velocity vs Radius (log–log)',    yDataCol: 'omega', xDataCol: 'radius',    yPanelLabel: 'Ang. velocity', xPanelLabel: 'Radius',    showVelArrow: false },
};
let currentPair = 'v_kappa';

// ─── State ────────────────────────────────────────────────────────────────────
let data = [], meta = {}, scales = {};
let currentIdx = 0, rafId = null, draggingSlider = false;
let playback = { playing: false, speed: 1.0, startIdx: 0, startWall: 0 };

let trajPts = [], speedPts = [], curvPts = [], loglogPts = [];
let llTrailCircles = [];

// ─── SVG helpers ──────────────────────────────────────────────────────────────
const SVG_NS = 'http://www.w3.org/2000/svg';
const $      = id => document.getElementById(id);

function svgEl(tag, attrs) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}
function setAttrs(el, attrs) {
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
}
function linearScale(dMin, dMax, rMin, rMax) {
  const k = (rMax - rMin) / (dMax - dMin);
  return v => rMin + (v - dMin) * k;
}
function pts2str(arr) {
  return arr.map(p => `${p.sx.toFixed(1)},${p.sy.toFixed(1)}`).join(' ');
}

// ─── Data loading ─────────────────────────────────────────────────────────────
async function loadData(filename) {
  const text = await (await fetch(`./${filename}`)).text();
  meta = {};
  const dataLines = [];
  for (const line of text.split('\n')) {
    if (line.startsWith('#')) {
      const [k, v] = line.slice(1).trim().split('=');
      meta[k.trim()] = parseFloat(v);
    } else if (line.trim()) {
      dataLines.push(line.trim());
    }
  }
  const headers = dataLines[0].split(',');
  data = dataLines.slice(1).map(line => {
    const vals = line.split(','), row = {};
    headers.forEach((h, j) => { row[h] = parseFloat(vals[j]); });
    return row;
  });
}

// ─── Scales ───────────────────────────────────────────────────────────────────
function setupScales() {
  // Trajectory — aspect-preserving fit
  const xMin = Math.min(...data.map(d => d.x)), xMax = Math.max(...data.map(d => d.x));
  const yMin = Math.min(...data.map(d => d.y)), yMax = Math.max(...data.map(d => d.y));
  const sc = Math.min((TRAJ.x2-TRAJ.x1)/(xMax-xMin), (TRAJ.y2-TRAJ.y1)/(yMax-yMin)) * 0.92;
  const cx = (TRAJ.x1+TRAJ.x2)/2, cy = (TRAJ.y1+TRAJ.y2)/2;
  scales.trajX     = v => cx + (v - (xMin+xMax)/2) * sc;
  scales.trajY     = v => cy - (v - (yMin+yMax)/2) * sc;
  scales.trajScale = sc;

  scales.maxSpeed = Math.max(...data.map(d => d.speed));

  // Time axis (x shared for both panels; y-scales depend on pair, set in buildTimeseries)
  const tMin = data[0].t, tMax = data[data.length-1].t;
  scales.speedX = linearScale(tMin, tMax, SPEED.x1, SPEED.x2);
  scales.curvX  = linearScale(tMin, tMax, CURV.x1,  CURV.x2);
}

function setupLoglogScales() {
  const { xCol, yCol } = PAIRS[currentPair];
  const valid = data.filter(d => !isNaN(d[xCol]) && !isNaN(d[yCol]));
  const xMin = Math.min(...valid.map(d=>d[xCol]))-0.2, xMax = Math.max(...valid.map(d=>d[xCol]))+0.2;
  const yMin = Math.min(...valid.map(d=>d[yCol]))-0.2, yMax = Math.max(...valid.map(d=>d[yCol]))+0.2;
  scales.llX    = linearScale(xMin, xMax, LL.x1, LL.x2);
  scales.llY    = linearScale(yMin, yMax, LL.y2, LL.y1);
  scales.llXMin = xMin; scales.llXMax = xMax;
}

// ─── Build time-series panels ─────────────────────────────────────────────────
function buildTimeseries() {
  const { yDataCol, xDataCol, yPanelLabel, xPanelLabel } = PAIRS[currentPair];
  const yVals = data.map(d => d[yDataCol]);
  const xVals = data.map(d => d[xDataCol]);
  scales.speedY = linearScale(Math.min(...yVals), Math.max(...yVals), SPEED.y2-5, SPEED.y1+5);
  scales.curvY  = linearScale(Math.min(...xVals), Math.max(...xVals), CURV.y2-5,  CURV.y1+5);
  speedPts = data.map(d => ({ sx: scales.speedX(d.t), sy: scales.speedY(d[yDataCol]) }));
  curvPts  = data.map(d => ({ sx: scales.curvX(d.t),  sy: scales.curvY(d[xDataCol]) }));
  $('speed-full').setAttribute('points', pts2str(speedPts));
  $('curv-full').setAttribute('points',  pts2str(curvPts));
  $('speed-label').textContent = yPanelLabel;
  $('curv-label').textContent  = xPanelLabel;
}

// ─── Build log–log panel ──────────────────────────────────────────────────────
function buildLoglog() {
  setupLoglogScales();

  const { xCol, yCol, xLabel, yLabel, title } = PAIRS[currentPair];

  // Recompute projected points for this pair
  loglogPts = data.map(d => {
    const xv = d[xCol], yv = d[yCol];
    const valid = !isNaN(xv) && !isNaN(yv);
    return { sx: valid ? scales.llX(xv) : null, sy: valid ? scales.llY(yv) : null, valid };
  });

  // Panel title
  $('ll-title').textContent = title;

  // Clip rect and border
  setAttrs($('ll-plot-clip-rect'), { x: LL.x1, y: LL.y1, width: LL.x2-LL.x1, height: LL.y2-LL.y1 });
  setAttrs($('ll-border'),         { x: LL.x1, y: LL.y1, width: LL.x2-LL.x1, height: LL.y2-LL.y1 });

  // Axis labels
  setAttrs($('ll-xlabel'), { x: (LL.x1+LL.x2)/2, y: LL.y2+18 });
  $('ll-xlabel').textContent = xLabel;
  setAttrs($('ll-ylabel'), { x: -(LL.y1+LL.y2)/2, y: LL.x1-18 });
  $('ll-ylabel').textContent = yLabel;

  // Background scatter
  const scatter = $('loglog-scatter');
  scatter.innerHTML = '';
  loglogPts.forEach(p => {
    if (p.valid) scatter.appendChild(svgEl('circle', { cx: p.sx, cy: p.sy, r: '2', fill: '#ccc' }));
  });

  // Regression lines
  const fitSlope  = meta[`${currentPair}_fit_slope`],  fitInt  = meta[`${currentPair}_fit_intercept`];
  const refSlope  = meta[`${currentPair}_ref_slope`],  refInt  = meta[`${currentPair}_ref_intercept`];
  const x0 = scales.llXMin, x1 = scales.llXMax;
  setAttrs($('ll-fit-line'), { x1: scales.llX(x0), y1: scales.llY(fitSlope*x0+fitInt), x2: scales.llX(x1), y2: scales.llY(fitSlope*x1+fitInt) });
  setAttrs($('ll-ref-line'), { x1: scales.llX(x0), y1: scales.llY(refSlope*x0+refInt), x2: scales.llX(x1), y2: scales.llY(refSlope*x1+refInt) });

  // Legend
  const legend = $('ll-legend');
  legend.innerHTML = '';
  const ly = LL.y1 + 14;
  legend.appendChild(svgEl('line', { x1: LL.x1+4, y1: ly,    x2: LL.x1+20, y2: ly,    stroke: '#1a5fa8', 'stroke-width': '1.5' }));
  legend.appendChild(svgEl('line', { x1: LL.x1+4, y1: ly+14, x2: LL.x1+20, y2: ly+14, stroke: '#b83232', 'stroke-width': '1.5', 'stroke-dasharray': '5,4' }));
  const t1 = svgEl('text', { x: LL.x1+24, y: ly+4,  'font-family': 'Helvetica,sans-serif', 'font-size': '10', fill: '#555' });
  t1.textContent = `Fit  (β = ${fitSlope.toFixed(2)})`;
  const t2 = svgEl('text', { x: LL.x1+24, y: ly+18, 'font-family': 'Helvetica,sans-serif', 'font-size': '10', fill: '#555' });
  t2.textContent = `Theory  (β = ${refSlope.toFixed(2)})`;
  legend.appendChild(t1); legend.appendChild(t2);

  // Trail circles
  const llTrl = $('loglog-trail');
  llTrl.innerHTML = '';
  llTrailCircles = [];
  for (let i = 0; i < LL_TRAIL; i++) {
    const c = svgEl('circle', { r: '3', fill: '#1a5fa8', visibility: 'hidden' });
    llTrl.appendChild(c);
    llTrailCircles.push(c);
  }
}

// ─── Build statics ────────────────────────────────────────────────────────────
function buildStatics() {
  trajPts = data.map(d => ({ sx: scales.trajX(d.x), sy: scales.trajY(d.y) }));

  // Trajectory
  $('g-traj').setAttribute('transform', '');
  $('traj-full').setAttribute('points', pts2str(trajPts));

  // Time panels — transforms and cursors only; data rebuilt in buildTimeseries
  $('g-speed').setAttribute('transform', `translate(${SPEED_G.tx},${SPEED_G.ty})`);
  $('g-curv').setAttribute('transform',  `translate(${CURV_G.tx},${CURV_G.ty})`);
  setAttrs($('speed-cursor'), { x1: SPEED.x1, x2: SPEED.x1, y1: SPEED.y1, y2: SPEED.y2 });
  setAttrs($('curv-cursor'),  { x1: CURV.x1,  x2: CURV.x1,  y1: CURV.y1,  y2: CURV.y2  });

  // Log–log
  $('g-loglog').setAttribute('transform', `translate(${LL_G.tx},${LL_G.ty})`);

  buildTimeseries();
  buildLoglog();
}

// ─── Trail helper ─────────────────────────────────────────────────────────────
function collectTrail(idx, validFn, maxN) {
  const tMin = data[idx].t - TRAIL_WIN;
  const out  = [];
  for (let i = idx; i >= 0 && out.length < maxN; i--) {
    if (data[i].t < tMin) break;
    if (validFn(i)) out.unshift(i);
  }
  return out;
}

function updateCircles(circles, idxArr, ptsFn, color) {
  const n = idxArr.length;
  circles.forEach((c, ci) => {
    if (ci >= n) { c.setAttribute('visibility', 'hidden'); return; }
    const pt  = ptsFn(idxArr[ci]);
    const age = (ci + 1) / n;
    setAttrs(c, { visibility: 'visible', cx: pt.sx.toFixed(1), cy: pt.sy.toFixed(1), opacity: (0.1 + 0.9*age).toFixed(2), fill: color });
  });
}

// ─── Render ───────────────────────────────────────────────────────────────────
function render(idx) {
  idx = Math.max(0, Math.min(idx, data.length - 1));
  currentIdx = idx;

  // 1. Trajectory
  $('traj-visited').setAttribute('points', pts2str(trajPts.slice(0, idx + 1)));

  const p = trajPts[idx];
  const d = data[idx];

  // Trajectory overlay: velocity arrow (v pairs) or Frenet frame (ω pairs)
  if (PAIRS[currentPair].showVelArrow) {
    $('frenet-t').setAttribute('visibility', 'hidden');
    $('frenet-n').setAttribute('visibility', 'hidden');
    if (!isNaN(d.tx) && !isNaN(d.ty)) {
      const lenPx = (d.speed / scales.maxSpeed) * VEL_ARROW_LEN;
      setAttrs($('vel-arrow'), { x1: p.sx, y1: p.sy, x2: (p.sx + d.tx * lenPx).toFixed(1), y2: (p.sy - d.ty * lenPx).toFixed(1), visibility: 'visible' });
    } else { $('vel-arrow').setAttribute('visibility', 'hidden'); }
  } else {
    $('vel-arrow').setAttribute('visibility', 'hidden');
    if (!isNaN(d.tx) && !isNaN(d.ty)) {
      setAttrs($('frenet-t'), { x1: p.sx, y1: p.sy, x2: (p.sx + d.tx * FRAME_LEN).toFixed(1), y2: (p.sy - d.ty * FRAME_LEN).toFixed(1), visibility: 'visible' });
    } else { $('frenet-t').setAttribute('visibility', 'hidden'); }
    if (!isNaN(d.nx) && !isNaN(d.ny)) {
      setAttrs($('frenet-n'), { x1: p.sx, y1: p.sy, x2: (p.sx + d.nx * FRAME_LEN).toFixed(1), y2: (p.sy - d.ny * FRAME_LEN).toFixed(1), visibility: 'visible' });
    } else { $('frenet-n').setAttribute('visibility', 'hidden'); }
  }

  // Osculating circle
  const oscR = (1 / (d.curvature + 1e-12)) * scales.trajScale;
  if (!isNaN(d.osc_cx) && !isNaN(d.osc_cy) && oscR < 600) {
    setAttrs($('osc-circle'), {
      cx: scales.trajX(d.osc_cx).toFixed(1), cy: scales.trajY(d.osc_cy).toFixed(1),
      r: oscR.toFixed(1), visibility: 'visible'
    });
  } else { $('osc-circle').setAttribute('visibility', 'hidden'); }

  setAttrs($('traj-dot'), { cx: p.sx, cy: p.sy });

  // 2. Speed
  const sxCur = speedPts[idx].sx;
  setAttrs($('speed-cursor'), { x1: sxCur, x2: sxCur, y1: SPEED.y1, y2: SPEED.y2 });
  $('speed-visited').setAttribute('points', pts2str(speedPts.slice(0, idx + 1)));

  // 3. Curvature
  const cxCur = curvPts[idx].sx;
  setAttrs($('curv-cursor'), { x1: cxCur, x2: cxCur, y1: CURV.y1, y2: CURV.y2 });
  $('curv-visited').setAttribute('points', pts2str(curvPts.slice(0, idx + 1)));

  // 4. Log–log trail + dot
  const llIdxs = collectTrail(idx, i => loglogPts[i].valid, LL_TRAIL);
  updateCircles(llTrailCircles, llIdxs, i => loglogPts[i], '#1a5fa8');

  const curLL = loglogPts[idx];
  if (curLL.valid) {
    setAttrs($('loglog-dot'), { cx: curLL.sx, cy: curLL.sy, visibility: 'visible' });
  } else {
    $('loglog-dot').setAttribute('visibility', 'hidden');
  }

  // 5. Slider sync
  if (!draggingSlider)
    $('time-slider').value = Math.round(idx / (data.length - 1) * 1000);
}

// ─── Animation ────────────────────────────────────────────────────────────────
function tick(wallNow) {
  if (!playback.playing) return;
  const elapsed  = (wallNow - playback.startWall) / 1000 * playback.speed;
  const targetT  = data[playback.startIdx].t + elapsed;
  let newIdx = playback.startIdx;
  while (newIdx < data.length - 1 && data[newIdx].t < targetT) newIdx++;
  render(newIdx);
  if (newIdx < data.length - 1) { rafId = requestAnimationFrame(tick); }
  else { playback.playing = false; updatePlayBtn(); }
}

function startPlay() {
  if (currentIdx >= data.length - 1) currentIdx = 0;
  playback.playing = true; playback.startIdx = currentIdx;
  playback.startWall = performance.now();
  updatePlayBtn();
  rafId = requestAnimationFrame(tick);
}

function pausePlay() {
  playback.playing = false;
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  updatePlayBtn();
}

function updatePlayBtn() {
  const btn = $('btn-play');
  btn.textContent = playback.playing ? '⏸ Pause' : '▶ Play';
  btn.classList.toggle('active', !playback.playing);
}

// ─── Init ─────────────────────────────────────────────────────────────────────
async function init(filename) {
  pausePlay(); currentIdx = 0;
  await loadData(filename);
  setupScales(); buildStatics(); render(0); updatePlayBtn();
}

// ─── Events ───────────────────────────────────────────────────────────────────
$('btn-play').addEventListener('click',  () => { playback.playing ? pausePlay() : startPlay(); });
$('btn-reset').addEventListener('click', () => { pausePlay(); currentIdx = 0; render(0); });
$('sel-dataset').addEventListener('change', e => init(e.target.value));

$('sel-pair').addEventListener('change', e => {
  currentPair = e.target.value;
  buildTimeseries();
  buildLoglog();
  render(currentIdx);
});

document.querySelectorAll('.speed-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const was = playback.playing; pausePlay();
    playback.speed = parseFloat(btn.dataset.speed);
    if (was) startPlay();
  });
});

const slider = $('time-slider');
slider.addEventListener('mousedown',  () => { draggingSlider = true;  pausePlay(); });
slider.addEventListener('touchstart', () => { draggingSlider = true;  pausePlay(); });
slider.addEventListener('mouseup',    () => { draggingSlider = false; });
slider.addEventListener('touchend',   () => { draggingSlider = false; });
slider.addEventListener('input', () => {
  render(Math.round(slider.value / 1000 * (data.length - 1)));
});

// ─── Boot ─────────────────────────────────────────────────────────────────────
init('medium_ellipse.csv');
</script>
</body>
</html>
